name: Project checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install controller dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install system Mininet for the unprivileged topology preflight test
        run: |
          sudo apt-get update
          sudo apt-get install -y mininet
      - name: Check source, measurements and documentation
        run: python -B verification/check_project.py
      - name: Optional dashboard observer tests
        run: python -B -m unittest discover -s tools/tests -v
      - name: Observed animation activity tests
        run: node --test tools/tests/test_activity.cjs
      - name: Compact tests (skips fail this gate)
        run: |
          python -B - <<'PY'
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PY
      - name: Extended regression tests (skips fail this gate)
        run: |
          python -B - <<'PY'
          import pathlib, subprocess, sys, tempfile, zipfile
          program = "import unittest; r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('.')); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
          with tempfile.TemporaryDirectory(prefix='sdn-regression-') as folder:
              with zipfile.ZipFile('verification/validation-toolkit.zip') as archive:
                  archive.extractall(folder)
              subprocess.run([sys.executable, '-B', '-c', program], cwd=folder, check=True)
          PY
